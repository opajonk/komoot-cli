name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-tag:
    name: validate tag
    runs-on: ubuntu-latest
    outputs:
      is_valid_semver: ${{ steps.validate.outputs.is_valid_semver }}

    steps:
      - name: Check tag format against semver 2.0.0
        id: validate
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          SEMVER_REGEX='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'

          if [[ "${TAG_NAME}" =~ ${SEMVER_REGEX} ]]; then
            echo "is_valid_semver=true" >> "${GITHUB_OUTPUT}"
            echo "Tag '${TAG_NAME}' is a valid semver 2.0.0 version with v prefix."
          else
            echo "is_valid_semver=false" >> "${GITHUB_OUTPUT}"
            echo "Tag '${TAG_NAME}' is not a valid semver 2.0.0 version with v prefix."
          fi

  build-binaries:
    name: build ${{ matrix.artifact_name }}
    needs: validate-tag
    if: needs.validate-tag.outputs.is_valid_semver == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: komoot-cli
            artifact_name: komoot-cli-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            executable: komoot-cli
            artifact_name: komoot-cli-linux-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: komoot-cli.exe
            artifact_name: komoot-cli-windows-x86_64.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            executable: komoot-cli.exe
            artifact_name: komoot-cli-windows-aarch64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.executable }} dist/${{ matrix.artifact_name }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  publish-release:
    name: publish release
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: write

    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: komoot-cli-*
          path: release-assets

      - name: Collect release assets
        run: |
          mkdir -p release-upload
          find release-assets -type f -exec cp {} release-upload/ \;

      - name: Create or update GitHub release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: release-upload/*
          fail_on_unmatched_files: true
