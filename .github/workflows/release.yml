name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-binaries:
    name: build ${{ matrix.artifact_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: komoot-export
            artifact_name: komoot-export-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            executable: komoot-export
            artifact_name: komoot-export-linux-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: komoot-export.exe
            artifact_name: komoot-export-windows-x86_64.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            executable: komoot-export.exe
            artifact_name: komoot-export-windows-aarch64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.executable }} dist/${{ matrix.artifact_name }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  publish-release:
    name: publish release
    runs-on: ubuntu-latest
    needs: build-binaries

    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v4.1.3
        with:
          pattern: komoot-export-*
          path: release-assets

      - name: Collect release assets
        run: |
          mkdir -p release-upload
          find release-assets -type f -exec cp {} release-upload/ \;

      - name: Create or update GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-upload/*
          fail_on_unmatched_files: true
